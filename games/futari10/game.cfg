# Mushihimesama Futari Ver 1.0, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Mushihimesama Futari Ver 1.0
title = Mushihimesama Futari Ver 1.0
id = futari10
app_id = io.github.tmcleroy.spelunkomp.futari10
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Rapid

# The ROM set (MAME's futari10): file:crc, found by checksum whatever the file is called
rom_set = futari10
# MAME's parent set: a split set keeps the files this game shares in futari15.zip, beside its own
rom_parent = futari15
rom_name = Mushihime-Sama Futari Ver 1.0 (Japan, 2006/10/23 MASTER VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2006-10-23
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = futari10_u4:b127dca7
nand = futari10_u2:78ffcd0c
sound = u23:39f1e1f4 u24:c631a766
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2040
