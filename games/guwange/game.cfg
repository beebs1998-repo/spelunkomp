# Guwange, the arcade game on Cave's 68000 board. Per-game settings read by the spelunkomp toolkit.

name = Guwange
title = Guwange
id = guwange
app_id = io.github.tmcleroy.spelunkomp.guwange
disclaimer = Not affiliated with Cave.
buttons = Shot|Bomb|Button C

# The ROM set (MAME's guwange): file:crc, found by checksum whatever the file is called
rom_set = guwange
rom_name = Guwange (Japan, 1999 6/24 Master Ver 16:55)
# When this version came out (the launcher sorts by it): the date in the version string
released = 1999-06-24
hardware = cave68k
board = guwange
program = gu-u0127.bin:f86b5293 gu-u0129.bin:6c0e3b93
# The sprites: 8 bits a pixel, the files in pairs (the second pair seen again above it); each with its own zoom
sprites = u083.bin:adc4b9c4 u082.bin:3d75876c u086.bin:188e4f81 u085.bin:a7d5659e
sprites_bits = 8
sprites_zoom = 1
# Three layers, 8 bits a pixel
layer0 = u101.bin:0369491f
layer0_bits = 8
layer1 = u10102.bin:e28d6855
layer1_bits = 8
layer2 = u10103.bin:0fe91b8e
layer2_bits = 8
sound = u0462.bin:b3d75691
eeprom = eeprom-guwange.bin:c3174959
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2040

# The board's settings (the Board page: runtime/board_settings.h), as the test menu's Configuration page keeps them in
# the EEPROM's word 4, found by changing each there and reading the EEPROM back. Word 1 is the sum of words 2 to 7,
# which the game checks.
board_option_1 = board_difficulty | Game difficulty | eeprom 4:8-9 | How hard the game is (the test menu's A to D). A new board: B. | A (easy)=1 | B (normal)=0 | C (hard)=2 | D (very hard)=3
board_option_2 = board_damage | Damage level | eeprom 4:12-13 | How much damage the enemies take from your shots. A new board: normal. | Very easy=2 | Easy=1 | Normal=0 | Hard=3
board_option_3 = board_c_button | C button | eeprom 4:2 | The board's own autofire: the C button fires as fast as it can while held (full auto). A new board: not used. | Not used=0 | Full auto=1
board_option_4 = board_continue | Continue | eeprom 4:14 | Whether a game can be continued. A new board: on. | On=0 | Off=1
board_option_5 = board_demo_sound | Advertise sound | eeprom 4:3 | Sound in the attract show. A new board: on. | On=0 | Off=1
board_checksum = eeprom 1 = sum 2-7
