#
# DoDonPachi II: Bee Storm, IGS's arcade game on its own PGM board (made under licence from Cave). Per-game settings
# read by the spelunkomp toolkit.

name = DoDonPachi II: Bee Storm
title = DoDonPachi II: Bee Storm
id = ddp2
app_id = io.github.tmcleroy.spelunkomp.ddp2
disclaimer = Not affiliated with Cave or IGS.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Rapid shot

# The ROM set (MAME's ddp2): file:crc@offset (hex), found by checksum whatever the file is called
rom_set = ddp2
rom_name = DoDonPachi II: Bee Storm (World, ver. 102)
# When this version came out (the launcher sorts by it): the date in the program (09/10/01)
released = 2001-09-10
# The hardware: IGS's PGM board (machine/pgm.h)
hardware = pgm
# The program: the PGM's BIOS, then the game (not enciphered: on this cartridge it is the ARM's program that is)
program = pgm_p02s.u20:78c15fa2@0 v102.u8:5a9ea040@100000
# The IGS027A, an ARM7 that is run (machine/arm7.h): its own ROM (the World chip's: the region is a byte of it) and
# the cartridge's ROM of ARM code, deciphered by the rules MAME calls ddp2's
arm_internal = ddp2_igs027a_world.bin:3654e20b@0
arm_external = v100_210.u23:06c3dd29@0
arm_external_size = 400000
arm_cipher = ddp2
# The text and background tiles (one region: the board's text ROM, then the game's over its end)
tiles = pgm_t01s.rom:1a7123a0@0 pgm_t1300.u21:e748f0cb@180000
tiles_size = A00000
sprite_pixels = pgm_a1300.u1:fc87a405@0 pgm_a1301.u2:0c8520da@800000
sprite_pixels_size = 1000000
sprite_masks = pgm_b1300.u7:ef646604@0
sprite_masks_size = 800000
# The samples: the board's sound ROM, then the game's
samples = pgm_m01s.rom:45ae7159@0 pgm_m1300.u5:82d4015d@400000
# The game's sound driver is in the Z80's RAM by this frame (the BIOS runs its own before: tools/translatez80.sh notes
# only what the game's reaches)
z80_driver_frame = 1000
# (no factory battery RAM in the set: the board starts with it empty, as MAME does, and the game fills it in)
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
# (the PGM's logo, the warning, IGS's logo and the opening's pictures come before it)
title_frame = 3480
