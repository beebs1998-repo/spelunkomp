# DoDonPachi Dai-Fukkatsu Ver 1.5, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi Dai-Fukkatsu Ver 1.5
title = DoDonPachi Dai-Fukkatsu Ver 1.5
id = ddpdfk
app_id = io.github.tmcleroy.spelunkomp.ddpdfk
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Hyper

# The ROM set (MAME's ddpdfk): file:crc, found by checksum whatever the file is called
rom_set = ddpdfk
rom_name = DoDonPachi Dai-Fukkatsu Ver 1.5 (Japan, 2008/06/23 MASTER VER 1.5)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2008-06-23
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = d
program = ddpdfk_u4:9976d699
nand = ddpdfk_u2:84a51a4f
sound = u23:27032cde u24:a6178c2c
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1920
