# Mushihimesama, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Mushihimesama
title = Mushihimesama
id = mushisam
app_id = io.github.tmcleroy.spelunkomp.mushisam
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto

# The ROM set (MAME's mushisam): file:crc, found by checksum whatever the file is called
rom_set = mushisam
rom_name = Mushihime-Sama (Japan, 2004/10/12.MASTER VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2004-10-12
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = mushisam_u4:15321b30
nand = mushisam_u2:4f0a842a
sound = u23:138e2050 u24:e3d05c9f
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1680
