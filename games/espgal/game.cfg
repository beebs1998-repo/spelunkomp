# Espgaluda, the arcade game on IGS's PGM board. Per-game settings read by the spelunkomp toolkit.

name = Espgaluda
title = Espgaluda
id = espgal
app_id = io.github.tmcleroy.spelunkomp.espgal
disclaimer = Not affiliated with Cave.
buttons = Shot|Laser|Kakusei|Guard barrier

# The ROM set (MAME's espgal): file:crc@offset (hex), found by checksum whatever the file is called
rom_set = espgal
rom_name = Espgaluda (2003/10/15 Master Ver)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2003-10-15
hardware = pgm
# The program: the game alone (no BIOS), deciphered from its start; the IGS027A at 400000
program = espgaluda_v100.u38:08ecec34@0
cipher = espgal@0
# (the cipher's table is worked out from the program itself as the set is loaded: this is its SHA-1, to check it by)
cipher_sha1 = 6619ec52c05ab239154a291bf82021766b94b387
protection = 400000
tiles = t01s.u18:1a7123a0@0 cave_t04801w064.u19:6021c79e@180000
tiles_size = A00000
sprite_pixels = cave_a04801w064.u7:26dd4932@0 cave_a04802w064.u8:0e6bf7a9@800000
sprite_pixels_size = 1000000
sprite_masks = cave_b04801w064.u1:98dce13a@0
sprite_masks_size = 800000
samples = cave_w04801b032.u17:60298536@400000
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1320

# The board's settings (the Board page: runtime/board_settings.h), where the test menu's Game and System Configuration
# pages keep them in the battery RAM, found by changing each there and reading the RAM back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | ram 801004.b | How hard the game is. A new board: normal. | Easy=0 | Normal=1 | Hard=2 | Very hard=3
board_option_2 = board_extend | Extend | ram 801005.b | The scores that give an extra life. A new board: 4,000,000 and 14,000,000. | 2,000,000 and 6,000,000=2 | 4,000,000 and 14,000,000=0 | 8,000,000 and 20,000,000=1 | None=3
board_option_3 = board_lives | Life counts | ram 801006.b | The lives a game starts with. A new board: 3. | 1=3 | 2=4 | 3=0 | 4=1 | 5=2
board_option_4 = board_full_auto | Full auto fire | ram 801007.b | The board's own autofire. A new board: off. | Off=0 | On=1
board_option_5 = board_continue | Continue | ram 801001.b | Whether a game can be continued. A new board: on. | On=1 | Off=0
board_option_6 = board_demo_sound | Demo sound | ram 801002.b | Sound in the attract show. A new board: on. | On=1 | Off=0
