# DoDonPachi Dai-Fukkatsu Ver 1.0, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi Dai-Fukkatsu Ver 1.0
title = DoDonPachi Dai-Fukkatsu Ver 1.0
id = ddpdfk10
app_id = io.github.tmcleroy.spelunkomp.ddpdfk10
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Hyper

# The ROM set (MAME's ddpdfk10): file:crc, found by checksum whatever the file is called
rom_set = ddpdfk10
rom_name = DoDonPachi Dai-Fukkatsu Ver 1.0 (Japan, 2008/05/16 MASTER VER)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2008-05-16
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = d
program = ddpdfk10_u4:a3d650b2
nand = ddpdfk10_u2:d349cb2a
sound = u23:27032cde u24:a6178c2c
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1920
