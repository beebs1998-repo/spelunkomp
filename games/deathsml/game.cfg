# Deathsmiles, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Deathsmiles
title = Deathsmiles
id = deathsml
app_id = io.github.tmcleroy.spelunkomp.deathsml
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot left|Shot right|Bomb

# The ROM set (MAME's deathsml): file:crc, found by checksum whatever the file is called
rom_set = deathsml
rom_name = Deathsmiles (Japan, 2007/10/09 MASTER VER)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2007-10-09
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = u4:1a7b98bf
nand = u2:59ef5d78
sound = u23:aab718c8 u24:83881d84
# The monitor lies as an ordinary screen does
rotate = 0
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1980
