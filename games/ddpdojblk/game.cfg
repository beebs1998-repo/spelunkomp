# DoDonPachi Dai-Ou-Jou Black Label, the arcade game on IGS's PGM board. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi Dai-Ou-Jou Black Label
title = DoDonPachi Dai-Ou-Jou Black Label
id = ddpdojblk
app_id = io.github.tmcleroy.spelunkomp.ddpdojblk
disclaimer = Not affiliated with Cave.
buttons = Shot|Bomb|Full auto

# The ROM set (MAME's ddpdojblk): file:crc@offset (hex), found by checksum whatever the file is called
rom_set = ddpdojblk
# MAME's parent set: a split set keeps the files this game shares in ddp3.zip, beside its own
rom_parent = ddp3
rom_name = DoDonPachi Dai-Ou-Jou Black Label (Japan, 2002.10.07.Black Ver, newer)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2002-10-07
hardware = pgm
# The program: the PGM BIOS without its logos, then the game (deciphered as Dai-Ou-Jou's); the IGS027A at 500000
program = ddp3_bios.u37:b3cc5c8f@0 ddb10_10_8_434f.u45:d21561db@100000
cipher = ddp3@100000
# (the cipher's table is worked out from the program itself as the set is loaded: this is its SHA-1, to check it by)
cipher_sha1 = beddaf8a3e6918364abd44816d2303d4f1d24569
protection = 500000
tiles = pgm_t01s.rom:1a7123a0@0 cave_t04401w064.u19:3a95f19c@180000
tiles_size = A00000
sprite_pixels = cave_a04401w064.u7:ed229794@0 cave_a04402w064.u8:752167b0@800000
sprite_pixels_size = 2000000
sprite_masks = cave_b04401w064.u1:17731c9d@0
sprite_masks_size = 1000000
samples = pgm_m01s.rom:45ae7159@0 cave_m04401b032.u17:5a0dbd76@400000
# The battery-backed RAM as the factory left it: the game will not start without the values it holds
nvram = ddp3blk_defaults.nv:c2282720
# The cartridge holds two games: version A (Dai-Ou-Jou of 2002.04.05) and B (Black Label), chosen on a screen at power
# on that starts at the choice kept here (0: A, as the factory left it). This entry starts at B; the player's own
# choice is then kept with the rest of the battery RAM
nvram_set = 803810:0001
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2760

# The board's settings (the Board page: runtime/board_settings.h), where the Black Label's test menu (its Game and
# System Configuration pages) keeps them in the battery RAM, after those of the cartridge's other game (803800 on),
# found by changing each there and reading the RAM back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | ram 80380C.b | How hard the game is. A new board: normal. | Easy=0 | Normal=1 | Hard=2 | Very hard=3
board_option_2 = board_extend | Extend | ram 80380D.b | The scores that give an extra ship (the test menu's old: Dai-Ou-Jou's, and new: Black Label's). A new board: 10,000,000 and 30,000,000 (new: 20,000,000 and 50,000,000). | 5,000,000 and 20,000,000 (new: 7,000,000 and 18,000,000)=2 | 10,000,000 and 30,000,000 (new: 20,000,000 and 50,000,000)=0 | 50,000,000 and 100,000,000 (new: 60,000,000 and 120,000,000)=1 | None=3
board_option_3 = board_ships | Ship stock | ram 80380E.b | The ships a game starts with. A new board: 3. | 1=3 | 2=4 | 3=0 | 4=1 | 5=2
board_option_4 = board_rapid_fire | Rapid fire (shot C) | ram 80380F.b | The board's own autofire button, C. A new board: on. | On=1 | Off=0
board_option_5 = board_continue | Continue | ram 803809.b | Whether a game can be continued. A new board: on. | On=1 | Off=0
board_option_6 = board_demo_sound | Demo sound | ram 80380A.b | Sound in the attract show. A new board: on. | On=1 | Off=0
