name = Ketsui: Kizuna Jigoku Tachi
title = Ketsui
id = ket
app_id = io.github.tmcleroy.spelunkomp.ket
disclaimer = Not affiliated with Cave.
buttons = Shot|Bomb|Full auto

# The ROM set (MAME's ket): file:crc@offset (hex), found by checksum whatever the file is called
rom_set = ket
rom_name = Ketsui: Kizuna Jigoku Tachi (2003/01/01. Master Ver.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2003-01-01
hardware = pgm
# The program: the game alone (no BIOS), deciphered from its start; the IGS027A at 400000
program = ketsui_v100.u38:dfe62f3b@0
cipher = ket@0
# (the cipher's table is worked out from the program itself as the set is loaded: this is its SHA-1, to check it by)
cipher_sha1 = 0a15624a62d39c2d02a4f6703b1ed46517f74d81
protection = 400000
tiles = pgm_t01s.rom:1a7123a0@0 cave_t04701w064.u19:2665b041@180000
tiles_size = A00000
sprite_pixels = cave_a04701w064.u7:5ef1b94b@0 cave_a04702w064.u8:26d6da7f@800000
sprite_pixels_size = 1000000
sprite_masks = cave_b04701w064.u1:1bec008d@0
sprite_masks_size = 800000
# (no board sound ROM on this cartridge's board)
samples = cave_m04701b032.u17:b46e22d1@400000
nvram = ket_defaults.nv:3ca892d8
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1320
