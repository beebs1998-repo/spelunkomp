# DoDonPachi, the arcade game on Cave's 68000 board. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi
title = DoDonPachi
id = ddonpach
app_id = io.github.tmcleroy.spelunkomp.ddonpach
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto

# The ROM set (MAME's ddonpach): file:crc, found by checksum whatever the file is called
rom_set = ddonpach
rom_name = DoDonPachi (World, 1997 2/ 5 Master Ver.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 1997-02-05
# The hardware (cave68k: Cave's first boards, a 68000; none named: a CV1000) and which board of it
hardware = cave68k
board = ddonpach
# The program's two halves (the even bytes, the odd bytes)
program = b1.u27:b5cdc8d3 b2.u26:6bbb063a
sprites = u50:14b260ec u51:e7ba8cce u52:02492ee0 u53:cb4c10f0
# The three layers' tiles; layer 2's have 8 bits a pixel, and the board gives it only 8 x 8 tiles
layer0 = u60:903096a7
layer1 = u61:d89b7631
layer2 = u62:292bfb6b
layer2_bits = 8
layer2_tiles = 8
sound = u6:9dfdafaf u7:795b17d5
# The EEPROM as the factory left it (the game writes its own without)
eeprom = eeprom-ddonpach:315fb546
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2940
