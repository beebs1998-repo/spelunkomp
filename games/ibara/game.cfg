# Ibara, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Ibara
title = Ibara
id = ibara
app_id = io.github.tmcleroy.spelunkomp.ibara
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Formation|Full auto

# The ROM set (MAME's ibara): file:crc, found by checksum whatever the file is called
rom_set = ibara
rom_name = Ibara (Japan, 2005/03/22 MASTER VER.., '06. 3. 7 ver.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2005-03-22
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = ibara_u4:d5fb6657
nand = u2:55840976
sound = u23:ee5e585d u24:f0aa3cb6
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1620
