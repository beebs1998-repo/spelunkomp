# Mushihimesama Futari Black Label Another Ver (2009), the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Mushihimesama Futari Black Label Another Ver (2009)
title = Mushihimesama Futari Black Label Another Ver (2009)
id = futaribl
app_id = io.github.tmcleroy.spelunkomp.futaribl
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Rapid

# The ROM set (MAME's futaribl): file:crc, found by checksum whatever the file is called
rom_set = futaribl
rom_name = Mushihime-Sama Futari Black Label - Another Ver (World, 2009/11/27 INTERNATIONAL BL)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2009-11-27
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = futaribli_u4:1971dd16
nand = futariblk_u2:08c6fd62
sound = u23:39f1e1f4 u24:c631a766
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1920
