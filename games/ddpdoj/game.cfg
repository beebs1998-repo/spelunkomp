# DoDonPachi Dai-Ou-Jou, the arcade game on IGS's PGM board. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi Dai-Ou-Jou
title = DoDonPachi Dai-Ou-Jou
id = ddpdoj
app_id = io.github.tmcleroy.spelunkomp.ddpdoj
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto

# The ROM set (MAME's ddpdoj): file:crc@offset (hex), found by checksum whatever the file is called
rom_set = ddpdoj
# MAME's parent set: a split set keeps the files this game shares in ddp3.zip, beside its own
rom_parent = ddp3
rom_name = DoDonPachi Dai-Ou-Jou (Japan, 2002.04.05.Master Ver)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2002-04-05
# The hardware: IGS's PGM board (machine/pgm.h)
hardware = pgm
# The program: a PGM BIOS with its logos taken out, then the game; the game deciphered by the rules MAME calls Photo
# Y2K 2's; the IGS027A answers at 500000
program = ddp3_bios.u37:b3cc5c8f@0 ddp3_v101.u36:195b5c1e@100000
cipher = ddp3@100000
# (the cipher's table is worked out from the program itself as the set is loaded: this is its SHA-1, to check it by)
cipher_sha1 = beddaf8a3e6918364abd44816d2303d4f1d24569
protection = 500000
# The text and background tiles (one region: the board's text ROM, then the game's over its end)
tiles = pgm_t01s.rom:1a7123a0@0 cave_t04401w064.u19:3a95f19c@180000
tiles_size = A00000
sprite_pixels = cave_a04401w064.u7:ed229794@0 cave_a04402w064.u8:752167b0@800000
sprite_pixels_size = 2000000
sprite_masks = cave_b04401w064.u1:17731c9d@0
sprite_masks_size = 1000000
# The samples: the board's sound ROM, then the game's
samples = pgm_m01s.rom:45ae7159@0 cave_m04401b032.u17:5a0dbd76@400000
# The battery-backed RAM as the factory left it (the settings)
nvram = ddp3_defaults.nv:571e96c0
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1320
