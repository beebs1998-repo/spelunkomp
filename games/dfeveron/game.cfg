# Dangun Feveron, the arcade game on Cave's 68000 board. Per-game settings read by the spelunkomp toolkit.

name = Dangun Feveron
title = Dangun Feveron
id = dfeveron
app_id = io.github.tmcleroy.spelunkomp.dfeveron
disclaimer = Not affiliated with Cave.
buttons = Shot|Bomb

# The ROM set (MAME's dfeveron): file:crc, found by checksum whatever the file is called
rom_set = dfeveron
# MAME's parent set: a split set keeps the files this game shares in feversos.zip, beside its own
rom_parent = feversos
rom_name = Dangun Feveron (Japan, 98/09/17 VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 1998-09-17
hardware = cave68k
board = dfeveron
program = cv01-u34.bin:be87f19d cv01-u33.bin:e53a7db3
# The sprites: in byte order, the left pixel of a byte in its low half; each sprite with its own zoom
sprites = cv01-u25.bin:a6f6a95d cv01-u26.bin:32edb62a
sprites_order = bytes
sprites_format = swapped
sprites_zoom = 1
sprites_colour_step = 16
# Two layers, 4 bits a pixel
layer0 = cv01-u50.bin:7a344417
layer1 = cv01-u49.bin:d21cdda7
layer_colour_base = 0x400
layer_colour_step = 16
background_pen = 0x3F0
sound = cv01-u19.bin:5f5514da
eeprom = eeprom-dfeveron.bin:c3174959
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2100
