# Mushihimesama Futari Ver 1.5, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Mushihimesama Futari Ver 1.5
title = Mushihimesama Futari Ver 1.5
id = futari15
app_id = io.github.tmcleroy.spelunkomp.futari15
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Rapid

# The ROM set (MAME's futari15): file:crc, found by checksum whatever the file is called
rom_set = futari15
rom_name = Mushihime-Sama Futari Ver 1.5 (Japan, 2006/12/8.MASTER VER. 1.54.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2006-12-08
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = futari15_u4:e8c5f128
nand = futari15_u2:b9eae1fc
sound = u23:39f1e1f4 u24:c631a766
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2040

# The board's settings (the Board page: runtime/board_settings.h), where the test menu's Game and System Configuration
# pages keep them in the EEPROM (a byte each: the high or low byte of a word), found by changing each there and
# reading the EEPROM back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | eeprom 9:0-7 | How hard the game is, from 1 (easy) to 4 (hard). A new board: 2. | 1 (easy)=0 | 2=1 | 3=2 | 4 (hard)=3
board_option_2 = board_ships | Ship stock | eeprom 11:0-7 | The ships a game starts with. A new board: 3. | 1=3 | 2=4 | 3=0 | 4=1 | 5=2
board_option_3 = board_continue | Continue | eeprom 7:0-7 | Whether a game can be continued. A new board: on. | On=1 | Off=0
board_option_4 = board_demo_sound | Demo sound | eeprom 8:8-15 | Sound in the attract show. A new board: on. | On=1 | Off=0
board_option_5 = board_rank_display | Rank display | eeprom 8:0-7 | The test menu's Rank disp. A new board: on. | On=1 | Off=0
