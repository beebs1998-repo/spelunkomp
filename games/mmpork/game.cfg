# Muchi Muchi Pork!, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Muchi Muchi Pork!
title = Muchi Muchi Pork!
id = mmpork
app_id = io.github.tmcleroy.spelunkomp.mmpork
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Lard attack|Bomb|Full auto

# The ROM set (MAME's mmpork): file:crc, found by checksum whatever the file is called
rom_set = mmpork
rom_name = Muchi Muchi Pork! (Japan, 2007/ 4/17 MASTER VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2007-04-17
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = u4:d06cfa42
nand = u2:1ee961b8
sound = u23:4a4b36df u24:ce83d07b
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1260

# The board's settings (the Board page: runtime/board_settings.h), where the test menu's DIP switch setting page keeps
# them in the EEPROM's words 1 and 2, found by changing each there and reading the EEPROM back. No checksum over them.
board_option_1 = board_difficulty1 | Difficulty 1 | eeprom 1:4-7 | The test menu's difficulty 1. A new board: normal. | Super easy=0 | Very easy=1 | Easy=2 | Normal=3 | Hard=4 | Very hard=5 | Super hard=6 | Unbelievable=7
board_option_2 = board_difficulty2 | Difficulty 2 | eeprom 1:0-3 | The test menu's difficulty 2. A new board: medium. | Minimum slow=0 | Very slow=1 | Slow=2 | Medium=3 | Fast=4 | Very fast=5 | Maximum fast=6 | Unforgettable=7
board_option_3 = board_extend | Extend | eeprom 2:11-15 | The score for each extra life. A new board: every 10,000,000. | None=0 | Every 6,000,000=2 | Every 7,000,000=3 | Every 8,000,000=4 | Every 9,000,000=5 | Every 10,000,000=6 | Every 20,000,000=7 | Every 30,000,000=8 | Every 40,000,000=9 | Every 50,000,000=10 | Every 90,000,000=14 | 7,000,000 only=18
board_option_4 = board_lives | Player counts | eeprom 2:8-10 | The lives a game starts with. A new board: 3. | 1=0 | 2=1 | 3=2 | 4=3 | 5=4 | 6=5 | Invincible=7
board_option_5 = board_continue | Continue play | eeprom 2:0-3 | How many times a game can be continued. A new board: free. | Disabled=0 | 1 time=1 | 2 times=2 | 3 times=3 | 4 times=4 | 5 times=5 | 6 times=6 | 7 times=7 | 8 times=8 | 9 times=9 | Free=10
board_option_6 = board_demo_sound | Demo sound | eeprom 2:4 | Sound in the attract show. A new board: on. | On=1 | Off=0
board_option_7 = board_ranking_save | Ranking save | eeprom 2:7 | Whether the rankings are kept. A new board: on. | On=1 | Off=0
