#
# Espgaluda II, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Espgaluda II
title = Espgaluda II
id = espgal2
app_id = io.github.tmcleroy.spelunkomp.espgal2
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Kakusei|Bomb|Full auto

# The ROM set (MAME's espgal2): file:crc, found by checksum whatever the file is called
rom_set = espgal2
rom_name = Espgaluda II (Japan, 2005/11/14.MASTER VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2005-11-14
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = espgal2_u4:2cb37c03
nand = u2:222f58c7
sound = u23:b9a10c22 u24:c76b1ec4
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1860

# The board's settings (the Board page: runtime/board_settings.h), where the test menu's Game and System Configuration
# pages keep them in the EEPROM (a byte each: the high or low byte of a word), found by changing each there and
# reading the EEPROM back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | eeprom 47:8-15 | How hard the game is, from 1 (easy) to 4 (hard). A new board: 2. | 1 (easy)=0 | 2=1 | 3=2 | 4 (hard)=3
board_option_2 = board_extend | Extend | eeprom 47:0-7 | The scores that give an extra life. A new board: 15,000,000 and 35,000,000. | 15,000,000 and 35,000,000=0 | 30,000,000 and 60,000,000=1 | Every 20,000,000=2 | 15,000,000 only=3
board_option_3 = board_lives | Life stock | eeprom 49:8-15 | The lives a game starts with. A new board: 3. | 1=3 | 2=4 | 3=0 | 4=1 | 5=2
board_option_4 = board_continue | Continue | eeprom 45:8-15 | Whether a game can be continued. A new board: on. | On=1 | Off=0
board_option_5 = board_demo_sound | Demo sound | eeprom 45:0-7 | Sound in the attract show. A new board: on. | On=1 | Off=0
board_option_6 = board_rank_display | Rank display | eeprom 46:8-15 | The test menu's Rank disp. A new board: on. | On=1 | Off=0
