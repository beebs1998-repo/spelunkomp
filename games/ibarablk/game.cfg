# Ibara Kuro Black Label, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Ibara Kuro
title = Ibara Kuro Black Label
id = ibarablk
app_id = io.github.tmcleroy.spelunkomp.ibarablk
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Formation|Full auto

# The ROM set (MAME's ibarablk): file:crc, found by checksum whatever the file is called
rom_set = ibarablk
rom_name = Ibara Kuro Black Label (Japan, 2006/02/06. MASTER VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2006-02-06
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = ibarablk_u4:ee1f1f77
nand = ibarablk_u2:5e46be44
sound = u23:a436bb22 u24:d11ab6b6
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1740

# The board's settings (the Board page: runtime/board_settings.h), where the test menu's DIP switch setting page keeps
# them in the EEPROM (a byte each: the high or low byte of words 3 to 5), found by changing each there and reading the
# EEPROM back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | eeprom 4:8-15 | How hard the game is. A new board: normal. | Super easy=0 | Very easy=1 | Easy=2 | Normal=3 | Hard=4 | Very hard=5 | Super hard=6 | Unbelievable=7
board_option_2 = board_extend | Extend | eeprom 5:8-15 | The score for each extra ship. A new board: every 10,000,000. | Every 10,000,000=1 | Every 20,000,000=2 | Every 30,000,000=3 | Every 40,000,000=4 | Every 50,000,000=5 | Every 60,000,000=6 | Every 70,000,000=7 | Every 80,000,000=8 | Every 90,000,000=9 | 10,000,000 only=10 | 20,000,000 only=11 | 30,000,000 only=12
board_option_3 = board_lives | Player counts | eeprom 5:0-7 | The ships a game starts with. A new board: 3. | 1=0 | 2=1 | 3=2 | 4=3 | 5=4 | 6=5 | Invincible=7
board_option_4 = board_continue | Continue play | eeprom 3:8-15 | How many times a game can be continued. A new board: free. | Disabled=0 | 1 time=1 | 2 times=2 | 3 times=3 | 4 times=4 | 5 times=5 | 6 times=6 | 7 times=7 | 8 times=8 | 9 times=9 | Free=10
board_option_5 = board_demo_sound | Demo sound | eeprom 3:0-7 | Sound in the attract show. A new board: on. | On=1 | Off=0
