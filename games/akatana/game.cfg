# Akai Katana, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Akai Katana
title = Akai Katana
id = akatana
app_id = io.github.tmcleroy.spelunkomp.akatana
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Phantom

# The ROM set (akatana, as MAME named it before the game was taken out of MAME in 2021): file:crc, found by checksum
# whatever the file is called
rom_set = akatana
rom_name = Akai Katana (Japan, 2010/ 8/13 MASTER VER.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2010-08-13
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = d
program = u4:613fd380
nand = u2:89a2e1a5
sound = u23:34a67e24 u24:10760fed
# The picture is turned this many degrees clockwise to stand it up (0: the monitor is the usual way round)
rotate = 0
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2100
