#
# Air Gallet, the arcade game on Cave's 68000 board (Gazelle's, for Banpresto, 1996). Per-game settings read by the
# spelunkomp toolkit.

name = Air Gallet
title = Air Gallet
id = agallet
app_id = io.github.tmcleroy.spelunkomp.agallet
disclaimer = Not affiliated with Cave, Gazelle or Banpresto.
buttons = Shot|Bomb

# The ROM set (MAME's agallet): file:crc, found by checksum whatever the file is called
rom_set = agallet
rom_name = Air Gallet (Europe)
# When this version came out (the launcher sorts by it)
released = 1996-02
hardware = cave68k
board = agallet
# The screen shows the chips' picture from its second pixel across
screen_left = 1
# The program: one file of 16-bit words
program = bp962a.u45:24815046
# The sound side: the Z80's program, the two OKIs' samples
z80 = bp962a.u9:06caddbe
sound = bp962a.u48:ae00a1ce
sound2 = bp962a.u47:6d4e9737
# The sprites: 4 bits a pixel in byte order, the left one in the low half; a sprite has its own zoom
sprites = bp962a.u76:858da439 bp962a.u77:ea2ba35e
sprites_order = bytes
sprites_format = swapped
sprites_zoom = 1
sprites_colour_step = 16
# The three layers. Layers 0 and 1: 4 bits a pixel (the board has only the second half of layer 0's ROM). Layer 2:
# 6 bits, 4 in one ROM and 2 in the second half of another; its first 64 K tiles paged by a bit beside the EEPROM's
layer0 = bp962a.u53:fcd9a107
layer0_from = 0x100000
layer0_colour_base = 0x400
layer1 = bp962a.u54:0cfa3409
layer1_colour_base = 0x800
layer2 = bp962a.u57:6d608957
layer2_high = bp962a.u65:135fcf9a
layer2_high_from = 0x100000
layer2_bits = 6
layer2_banked = 1
layer2_colour_base = 0xC00
layer_colour_step = 16
background_pen = 0x7F0
eeprom = agallet_europe.nv:ec38bf65
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 952

# The board's settings (the Board page: runtime/board_settings.h), as the test menu's DIP-SW setting page keeps them in
# the EEPROM, a word each, found by changing each there and reading the EEPROM back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | eeprom 10 | How hard the game is. A new board: normal. | Very easy=0 | Easy=1 | Medium easy=2 | Normal=3 | Medium hard=4 | Hard=5 | Very hard=6 | Extra hard=7
board_option_2 = board_heroes | Hero counts | eeprom 11 | The ships a game starts with. A new board: 3. | 1=3 | 2=2 | 3=0 | 5=1
board_option_3 = board_extend | 1UP item appear point | eeprom 20 | The score at which the extra ship's item appears. A new board: 1,500,000. | 1,000,000=1 | 1,500,000=0 | 2,000,000=2 | None=3
board_option_4 = board_demo_sound | Demonstration sound | eeprom 14 | Sound in the attract show. A new board: on. | On=0 | Off=1
