# DonPachi (Japan, Ver. 1.01), the arcade game on Cave's 68000 board. Per-game settings read by the spelunkomp toolkit.

name = DonPachi
title = DonPachi
id = donpachij
app_id = io.github.tmcleroy.spelunkomp.donpachij
disclaimer = Not affiliated with Cave.
buttons = Shot|Bomb

# The ROM set (MAME's donpachij): file:crc, found by checksum whatever the file is called
rom_set = donpachij
# MAME's parent set: a split set keeps the files this game shares in donpachi.zip, beside its own
rom_parent = donpachi
rom_name = DonPachi (Japan, Ver. 1.01)
# When this version came out (the launcher sorts by it): the date in the version string
released = 1995-05-11
hardware = cave68k
board = donpachi
# The program: one file of 16-bit words
program = prg.u29:6be14af6
sprites = atdp.u44:7189e953 atdp.u45:6984173f
sprites_colour_step = 16
# The three layers' tiles, 4 bits a pixel; layer 2 has only 8 x 8 tiles
layer0 = atdp.u54:6bda6b66
layer1 = atdp.u57:0a0e72b9
layer2 = u58.bin:285379ff
layer2_tiles = 8
layer_colour_base = 0x400
layer_colour_step = 16
background_pen = 0x7F0
# The two OKI chips' samples (the first chip's; the second's, paged by the NMK112)
sound = atdp.u33:d749de00
sound2 = atdp.u32:0d89fcca atdp.u33:d749de00
eeprom = eeprom-donpachi.bin:315fb546
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2520

# The board's settings (the Board page: runtime/board_settings.h), as the test menu's Configuration page keeps them in
# the EEPROM's word 4, found by changing each there and reading the EEPROM back. Word 1 is the sum of words 2 to 7,
# which the game checks.
board_option_1 = board_difficulty | Game difficulty | eeprom 4:8-9 | How hard the game is (the test menu's A to D). A new board: B. | A (easy)=1 | B (normal)=0 | C (hard)=2 | D (very hard)=3
board_option_2 = board_extend | Extend | eeprom 4:10-11 | The scores that give an extra ship. A new board: 2,000,000 only. | 2,000,000 only=0 | 1,000,000 and 6,000,000=1 | 5,000,000, then every 8,000,000=2 | None=3
board_option_3 = board_heroes | Hero counts | eeprom 4:12-13 | The ships a game starts with. A new board: 3. | 1=3 | 2=2 | 3=0 | 5=1
board_option_4 = board_c_button | C button | eeprom 4:2 | The board's own autofire: the C button fires as fast as it can while held (full auto). A new board: not used. | Not used=0 | Full auto=1
board_option_5 = board_continue | Continue | eeprom 4:15 | Whether a game can be continued. A new board: on. | On=0 | Off=1
board_option_6 = board_demo_sound | Advertise sound | eeprom 4:3 | Sound in the attract show. A new board: on. | On=0 | Off=1
board_checksum = eeprom 1 = sum 2-7
