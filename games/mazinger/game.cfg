#
# Mazinger Z, the arcade game on Cave's 68000 board (Banpresto's, 1994). Per-game settings read by the spelunkomp toolkit.

name = Mazinger Z
title = Mazinger Z
id = mazinger
app_id = io.github.tmcleroy.spelunkomp.mazinger
disclaimer = Not affiliated with Cave, Banpresto, Dynamic Planning or Toei Animation.
buttons = Shot|Special attack|Bomb

# The ROM set (MAME's mazinger): file:crc, found by checksum whatever the file is called
rom_set = mazinger
rom_name = Mazinger Z (World)
# When this version came out (the launcher sorts by it): the date in the program
released = 1994-06-27
hardware = cave68k
board = mazinger
# The screen: 384 across (the other boards' is 320)
screen_width = 384
# The program: one file of 16-bit words; and a second ROM of data at D00000
program = mzp-0.u24:43a4279f
program2 = mzp-1.924:db40acba
# The sound side: the Z80's program, the OKI's samples
z80 = mzs.u21:c5b4f7ed
sound = bp943a-4.u64:3fc7f29a
# The sprites: 4 bits a pixel in byte order, the left one in the low half; read through scrambled address lines; a
# sprite has its own zoom; the chip shows the list chosen a frame before
sprites = bp943a-2.u56:97e13959 bp943a-3.u55:9c4957dd
sprites_order = bytes
sprites_format = swapped
sprites_cipher = mazinger
sprites_zoom = 1
sprites_delay = 1
sprites_colour_step = 16
# The two layers, of 8 x 8 tiles only: layer 0 of 4 bits a pixel, its colours with the sprites'; layer 1 of 6
layer0 = bp943a-1.u60:46327415
layer0_tiles = 8
layer0_colour_base = 0
layer0_colour_step = 16
layer1 = bp943a-0.u63:c1fed98a
layer1_tiles = 8
layer1_bits = 6
layer1_colour_base = 0x400
background_pen = 0x3F0
eeprom = mazinger_world.nv:4f6225c6
rotate = 90
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1520

# The board's settings (the Board page: runtime/board_settings.h), as the test menu's DIP-SW setting page keeps them in
# the EEPROM's word 0 (as switches would be: a bit set for off), found by changing each there and reading the EEPROM
# back. No checksum over them.
board_option_1 = board_difficulty | Difficulty | eeprom 0:11-13 | How hard the game is, from 1 (easy) to 8 (hard). A new board: 3. | 1 (easy)=7 | 2=6 | 3=5 | 4=4 | 5=3 | 6=2 | 7=1 | 8 (hard)=0
board_option_2 = board_life_gauge | Life gauge | eeprom 0:8-10 | How long the energy gauge is, from 1 to 5. A new board: 3. | 1=7 | 2=6 | 3=5 | 4=4 | 5=3
board_option_3 = board_demo_sound | Demonstration sound | eeprom 0:15 | Sound in the attract show. A new board: on. | On=1 | Off=0
