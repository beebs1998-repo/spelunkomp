# Deathsmiles MegaBlack Label, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Deathsmiles MegaBlack Label
title = Deathsmiles MegaBlack Label
id = dsmbl
app_id = io.github.tmcleroy.spelunkomp.dsmbl
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot left|Shot right|Bomb

# The ROM set (MAME's dsmbl): file:crc, found by checksum whatever the file is called
rom_set = dsmbl
rom_name = Deathsmiles MegaBlack Label (Japan, 2008/10/06 MEGABLACK LABEL VER)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2008-10-06
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = d
program = u4:77fc5ad1
nand = u2:d6b85b7a
sound = u23:a9536a6a u24:3b673326
# The picture is turned this many degrees clockwise to stand it up (0: the monitor is the usual way round)
rotate = 0
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2760
