# ESP Ra.De., the arcade game on Cave's 68000 board. Per-game settings read by the spelunkomp toolkit.

name = ESP Ra.De.
title = ESP Ra.De.
id = esprade
app_id = io.github.tmcleroy.spelunkomp.esprade
disclaimer = Not affiliated with Cave.
buttons = Shot|Laser|Guard barrier

# The ROM set (MAME's esprade): file:crc, found by checksum whatever the file is called
rom_set = esprade
rom_name = ESP Ra.De. (World, 1998 4/22 International Ver.)
# When this version came out (the launcher sorts by it): the date in the version string
released = 1998-04-22
hardware = cave68k
board = esprade
program = u42.int:3b510a73 u41.int:97c1b649
# The sprites: 8 bits a pixel, the files in pairs; each sprite with its own zoom
sprites = esp_u63.u63:2f2fe92c esp_u64.u64:491a3da4 esp_u65.u65:06563efe esp_u66.u66:7bbe4cfc
sprites_bits = 8
sprites_zoom = 1
# Three layers, 8 bits a pixel
layer0 = esp_u54.u54:e7ca6936 esp_u55.u55:f53bd94f
layer0_bits = 8
layer1 = esp_u52.u52:e7abe7b4 esp_u53.u53:51a0f391
layer1_bits = 8
layer2 = esp_u51.u51:0b9b875c
layer2_bits = 8
sound = esp_u19.u19:f54b1cab
eeprom = eeprom-esprade.bin:315fb546
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1620

# The board's settings (the Board page: runtime/board_settings.h), as the test menu's Configuration page keeps them in
# the EEPROM's word 4, found by changing each there and reading the EEPROM back. Word 1 is the sum of words 2 to 7,
# which the game checks.
board_option_1 = board_difficulty | Game difficulty | eeprom 4:8-9 | How hard the game is (the test menu's A to D). A new board: B. | A (easy)=1 | B (normal)=0 | C (hard)=2 | D (very hard)=3
board_option_2 = board_extend | Extend | eeprom 4:10-11 | The scores that give an extra life. A new board: 4,000,000 and 8,000,000. | 2,000,000 and 5,000,000=1 | 4,000,000 and 8,000,000=0 | Every 2,000,000=2 | None=3
board_option_3 = board_heroes | Hero counts | eeprom 4:12-13 | The lives a game starts with. A new board: 3. | 1=3 | 2=2 | 3=0 | 5=1
board_option_4 = board_full_auto | Full auto | eeprom 4:2 | The board's own autofire: A and B fire as fast as they can while held. A new board: off. | Off=0 | A and B=1
board_option_5 = board_continue | Continue | eeprom 4:15 | Whether a game can be continued. A new board: on. | On=0 | Off=1
board_option_6 = board_demo_sound | Advertise sound | eeprom 4:3 | Sound in the attract show. A new board: on. | On=0 | Off=1
board_checksum = eeprom 1 = sum 2-7
