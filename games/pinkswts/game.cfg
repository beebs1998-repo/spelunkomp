#
# Pink Sweets: Ibara Sorekara, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = Pink Sweets
title = Pink Sweets: Ibara Sorekara
id = pinkswts
app_id = io.github.tmcleroy.spelunkomp.pinkswts
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Option|Full auto

# The ROM set (MAME's pinkswts): file:crc, found by checksum whatever the file is called
rom_set = pinkswts
rom_name = Pink Sweets: Ibara Sorekara (Japan, 2006/04/06 MASTER VER....)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2006-04-06
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = b
program = pinkswts_u4:5d812c9e
nand = pinkswts_u2:a2fa5363
sound = u23:4b82d250 u24:e93f0627
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1260
