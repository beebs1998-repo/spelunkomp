# DoDonPachi Dai-Fukkatsu Black Label, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi Dai-Fukkatsu Black Label
title = DoDonPachi Dai-Fukkatsu Black Label
id = dfkbl
app_id = io.github.tmcleroy.spelunkomp.dfkbl
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Hyper

# The ROM set (MAME's dfkbl): file:crc, found by checksum whatever the file is called
rom_set = dfkbl
rom_name = DoDonPachi Dai-Fukkatsu Black Label (Japan, 2010/1/18 BLACK LABEL)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2010-01-18
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = d
program = u4:8092ca9d
nand = u2:29f9d73a
sound = u23:36d4093b u24:31f9eb0a
# The monitor is on its side: the picture is turned this many degrees clockwise to stand it up
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1860
