# DonPachi, the arcade game on Cave's 68000 board. Per-game settings read by the spelunkomp toolkit.

name = DonPachi (US 1.12)
title = DonPachi (US 1.12)
id = donpachi
app_id = io.github.tmcleroy.spelunkomp.donpachi
disclaimer = Not affiliated with Cave.
buttons = Shot|Bomb

# The ROM set (MAME's donpachi): file:crc, found by checksum whatever the file is called
rom_set = donpachi
rom_name = DonPachi (US, Ver. 1.12)
# When this version came out (the launcher sorts by it): the date in the version string
released = 1995-05
hardware = cave68k
board = donpachi
# The program: one file of 16-bit words
program = prgu.u29:89c36802
sprites = atdp.u44:7189e953 atdp.u45:6984173f
sprites_colour_step = 16
# The three layers' tiles, 4 bits a pixel; layer 2 has only 8 x 8 tiles
layer0 = atdp.u54:6bda6b66
layer1 = atdp.u57:0a0e72b9
layer2 = text.u58:5dba06e7
layer2_tiles = 8
layer_colour_base = 0x400
layer_colour_step = 16
background_pen = 0x7F0
# The two OKI chips' samples (the first chip's; the second's, paged by the NMK112)
sound = atdp.u33:d749de00
sound2 = atdp.u32:0d89fcca atdp.u33:d749de00
eeprom = eeprom-donpachi.u10:315fb546
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 2520
