# DoDonPachi SaiDaiOuJou, the arcade game on the Cave CV1000. Per-game settings read by the spelunkomp toolkit.

name = DoDonPachi SaiDaiOuJou
title = DoDonPachi SaiDaiOuJou
id = ddpsdoj
app_id = io.github.tmcleroy.spelunkomp.ddpsdoj
disclaimer = Not affiliated with Cave.
# The buttons, as the game uses them (the launcher's Controllers page)
buttons = Shot|Bomb|Full auto|Hyper

# The ROM set (ddpsdoj, as MAME named it before the game was taken out of MAME in 2021): file:crc, found by checksum
# whatever the file is called
rom_set = ddpsdoj
rom_name = DoDonPachi SaiDaiOuJou (Japan, 2012/ 4/20)
# When this version came out (the launcher sorts by it): the date in the version string
released = 2012-04-20
# The board: b (CV1000-B, 8 MB of RAM) or d (CV1000-D, 16 MB)
board = d
program = u4:e2a4411c
nand = u2:668e4cd6
sound = u23:ac94801c u24:f593045b
# The picture is turned this many degrees clockwise to stand it up (0: the monitor is the usual way round)
rotate = 270
# Straight to the title (the Game page's Start): the boot runs unseen up to this frame of the board, the title then up
title_frame = 1920
