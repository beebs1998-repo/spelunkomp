# A pushed tag vX.Y.Z opens a draft release (docs/RELEASING.md): it checks the tag against VERSION, audits the files,
# and writes the release's notes from the version's section of CHANGELOG.md (tools/release/notes.sh: it fails if
# there is none). It builds
# nothing: the downloads hold code translated from the games, which needs their ROM sets, so a maintainer builds them
# on their own machine (tools/release/all.sh), plays each, uploads them to the draft and publishes it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version in VERSION
        run: |
          [ "v$(cat VERSION)" = "$GITHUB_REF_NAME" ] || { echo "VERSION says $(cat VERSION), the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: tools/audit.sh
      - name: Notes from the changelog
        run: tools/release/notes.sh "$(cat VERSION)" > notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag \
            --title "Spelunkomp ${GITHUB_REF_NAME#v}" --notes-file notes.md
